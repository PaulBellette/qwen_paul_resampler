[project]
name = "qwen-paul-resampler"
version = "0.4.0"
description = "Tiny Qwen proof-of-concept for personal-style resampling and likelihood-ratio reranking"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "transformers>=4.51",
  "peft>=0.15",
  "accelerate>=1.4",
]

[project.scripts]
paul-resampler = "paul_resampler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paul_resampler"]
